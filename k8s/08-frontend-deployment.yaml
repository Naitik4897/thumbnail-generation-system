apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: thumbnail-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thumbnail-frontend
  template:
    metadata:
      labels:
        app: thumbnail-frontend
    spec:
      containers:
        - name: frontend
          image: thumbnail-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:5000"
            - name: NEXT_PUBLIC_WS_URL
              value: "http://localhost:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: thumbnail-system
spec:
  selector:
    app: thumbnail-frontend
  ports:
    - port: 3000
      targetPort: 3000
